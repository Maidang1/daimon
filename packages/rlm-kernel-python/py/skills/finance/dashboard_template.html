<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QDII 基金净值看板</title>
<style>
:root{
  --bg:#fafafa; --panel:#ffffff; --panel2:#f4f4f5; --line:#e4e4e7;
  --txt:#09090b; --dim:#52525b; --faint:#71717a;
  --up:#cf222e; --down:#1a7f37; --warn:#d97706; --ok:#1a7f37; --bad:#cf222e;
  --mono:"SF Mono","Geist Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px;max-width:1280px;margin:0 auto}
h1{font-size:20px;font-weight:700;letter-spacing:.5px}
h1 small{font-size:12px;color:var(--faint);font-weight:400;margin-left:10px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.meta{color:var(--dim);font-size:12px;margin-bottom:18px}
.meta .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 8px;margin-right:8px;font-family:var(--mono)}
.summary{color:var(--dim);font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#3d4b5f}
.card.err{border-color:var(--bad)}
.card .name{font-size:15px;font-weight:600}
.card .code{font-family:var(--mono);color:var(--faint);font-size:12px;margin-left:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.nav{font-family:var(--mono);font-size:30px;font-weight:700;margin:8px 0 0}
.nav .lbl{font-size:11px;color:var(--faint);font-weight:400;display:block;font-family:-apple-system,sans-serif}
.chg{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)}
.predbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.predbox .t{font-size:12px;color:var(--dim)}
.predbox .v{font-family:var(--mono);font-size:20px;font-weight:700}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:1px 7px;margin-left:8px;vertical-align:2px}
.badge.lock{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.4)}
.badge.wait{background:rgba(232,161,58,.15);color:var(--warn);border:1px solid rgba(232,161,58,.4)}
.band{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:4px}
.weights{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.w{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--dim);font-family:var(--mono)}
.w b{color:var(--txt)}
.signals{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.sig{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--dim)}
.sig i{width:8px;height:8px;border-radius:50%;flex:none}
.sig.ok i{background:var(--ok)} .sig.warn i{background:var(--warn)} .sig.bad i{background:var(--bad)}
.alert{margin-top:10px;font-size:12px;color:var(--warn)}
.errbox{margin-top:10px;font-size:12px;color:var(--bad);word-break:break-all}
.intraday{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--dim)}
.intraday .v{font-family:var(--mono);font-size:16px;font-weight:700}
.detail{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.card.open .detail{display:block}
.detail h4{font-size:12px;color:var(--faint);font-weight:600;margin:10px 0 6px}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
td,th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{text-align:left;font-family:-apple-system,sans-serif}
th{color:var(--faint);font-weight:400;font-size:11px}
.spark{margin-top:10px}
.spark svg{width:100%;height:56px;display:block}
.sec{margin-top:28px}
.sec h2{font-size:15px;margin-bottom:10px}
.sec .empty{color:var(--faint);font-size:13px}
.footer{margin-top:32px;color:var(--faint);font-size:11px;border-top:1px solid var(--line);padding-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sv{font-size:24px;font-weight:700}
.sl{font-size:11px;color:var(--faint);margin-top:2px}
.stat .neg{color:var(--down)} .stat .pos{color:var(--up)}
.ops{margin-top:10px}
.opsummary{font-size:12px;color:var(--faint);margin-bottom:8px}
@media(max-width:420px){body{padding:14px}.nav{font-size:24px}}
</style>
</head>
<body>
<div class="head">
  <h1>QDII 基金净值看板<small id="kind"></small></h1>
  <div id="updated" style="color:var(--dim);font-size:12px"></div>
</div>
<div class="meta" id="meta"></div>
<div class="summary" id="summary"></div>
<div class="sec" id="holdingsSec" style="margin-top:0"></div>
<div class="grid" id="grid"></div>
<div class="sec"><h2>历史核对</h2><div id="track"></div></div>
<div class="sec"><h2>修正记录</h2><div id="corr"></div></div>
<div class="sec" id="opsSec"><h2>我的操作记录</h2><div id="ops"></div></div>
<div class="footer" id="footer"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const {artifact, results, holdingsInit, opsBaseline} = JSON.parse(document.getElementById("data").textContent);
const C = v => v==null ? '<span class="dim">—</span>' : (v>0?'<span class="up">+'+v+'%</span>':v<0?'<span class="down">'+v+'%</span>':'<span class="dim">0.00%</span>');
const CN = v => v==null?'—':Number(v).toFixed(4);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- 我的持仓与盈亏 ----------------
   ops 由 daimon agent 维护（finance.add_op/delete_op），构建时烘焙进本页；
   页面只读，不在浏览器本地保存任何数据。 */
let ops = Array.isArray(opsBaseline) ? opsBaseline.slice() : [];

const fundNav = {};
(artifact.funds||[]).forEach(f => { fundNav[f.code] = {nav:f.officialNav, date:f.officialDate}; });
const FM = v => v==null ? "—" : Number(v).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const FS = v => v==null ? "—" : Number(v).toLocaleString("zh-CN",{maximumFractionDigits:2});
const PNL = (v, suffix) => {
  if (v==null || !isFinite(v)) return '<span class="dim">—</span>';
  const cls = v>0 ? "up" : v<0 ? "down" : "dim";
  return `<span class="${cls}">${v>0?"+":""}${suffix? v.toFixed(2) : FM(v)}</span>`;
};

function computePos(code){
  const init = holdingsInit[code]; if (!init) return null;
  const mine = ops.filter(o=>o.code===code)
    .sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : 0);
  let shares = init.shares, cost = init.cost_amount;
  for (const o of mine){
    if (o.type === "buy"){ shares += o.shares; cost += o.amount; }
    else { const avg = shares>0 ? cost/shares : 0; shares -= o.shares; cost -= o.shares*avg; }
  }
  const nv = fundNav[code] || {};
  const nav = nv.nav==null ? null : nv.nav;
  const value = nav==null ? null : shares*nav;
  const pnl = value==null ? null : value - cost;
  const pnlPct = (pnl==null || cost<=0) ? null : pnl/cost*100;
  return {code, name:init.name||code, shares, cost, avg:shares>0?cost/shares:null,
          nav, navDate:nv.date||"", value, pnl, pnlPct, nOps:mine.length};
}

function renderHoldings(){
  const codes = Object.keys(holdingsInit||{});
  const sec = document.getElementById("holdingsSec");
  if (!codes.length){ sec.innerHTML = ""; return; }
  const pos = codes.map(computePos).filter(Boolean);
  const navDate = pos.map(p=>p.navDate).filter(Boolean).sort().slice(-1)[0] || "";
  const totCost = pos.reduce((s,p)=>s+p.cost,0);
  const totValue = pos.reduce((s,p)=>s+(p.value||0),0);
  const hasAllVal = pos.every(p=>p.value!=null);
  const totPnl = hasAllVal ? totValue - totCost : null;
  const totPct = (totPnl==null || totCost<=0) ? null : totPnl/totCost*100;
  const cards = pos.map(p => `
    <div class="stat">
      <div style="font-size:13px;font-weight:600">${esc(p.name)}<span class="code">${esc(p.code)}</span></div>
      <div class="row" style="margin-top:6px">
        <div class="sv ${p.pnl==null?"":p.pnl>0?"pos":p.pnl<0?"neg":""}">${p.pnl==null?"—":(p.pnl>0?"+":"")+FM(p.pnl)}</div>
        <div style="text-align:right">${PNL(p.pnlPct,true)}%</div>
      </div>
      <div class="sl">市值 ${FM(p.value)} ／ 成本 ${FM(p.cost)}</div>
      <div class="sl">份额 ${FS(p.shares)} · 成本价 ${p.avg==null?"—":p.avg.toFixed(4)} · 净值 ${CN(p.nav)}（${esc(p.navDate)}）</div>
    </div>`).join("");
  sec.innerHTML = `<h2>我的持仓盈亏${navDate?`（净值日 ${esc(navDate)}）`:""}</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">
    ${cards}
    <div class="stat" style="border-color:#3d4b5f">
      <div style="font-size:13px;font-weight:600">合计</div>
      <div class="row" style="margin-top:6px">
        <div class="sv ${totPnl==null?"":totPnl>0?"pos":totPnl<0?"neg":""}">${totPnl==null?"—":(totPnl>0?"+":"")+FM(totPnl)}</div>
        <div style="text-align:right">${PNL(totPct,true)}%</div>
      </div>
      <div class="sl">总市值 ${FM(hasAllVal?totValue:null)} ／ 总成本 ${FM(totCost)}</div>
      <div class="sl">已记录操作 ${ops.length} 笔 · <a href="#opsSec" style="color:var(--dim)">查看 →</a></div>
    </div></div>`;
}

function renderOps(){
  const codes = Object.keys(holdingsInit||{});
  const box = document.getElementById("ops");
  if (!codes.length){ box.innerHTML = '<div class="empty">暂无持仓配置</div>'; return; }
  const rows = ops.slice().sort((a,b)=> a.date<b.date?1 : a.date>b.date?-1 : 0);
  box.innerHTML = `<div class="ops">
    <div class="opsummary">操作由 daimon agent 记录与维护——在会话里说"帮我记一笔 008401 买入 100 份 @ 1.2345"即可，看板会自动刷新。本页只读。</div>
    ${rows.length ? `<table><tr><th>日期</th><th>基金</th><th>类型</th><th>份额</th><th>价格</th><th>金额</th><th>备注</th></tr>
      ${rows.map(o=>`<tr><td>${esc(o.date)}</td><td>${esc(o.code)}</td>
        <td class="${o.type==="buy"?"up":"down"}">${o.type==="buy"?"买入":"卖出"}</td>
        <td>${FS(o.shares)}</td><td>${CN(o.price)}</td><td>${FM(o.amount)}</td>
        <td style="white-space:normal;font-family:-apple-system,sans-serif;color:var(--dim)">${esc(o.note||"")}</td></tr>`).join("")}</table>`
    : '<div class="empty">还没有操作记录，在会话里让 agent 记一笔买入/卖出</div>'}
  </div>`;
}

renderHoldings(); renderOps();

document.getElementById("kind").textContent = artifact.jobLabel||"";
document.getElementById("updated").textContent = "更新：" + artifact.updatedAt;
document.getElementById("meta").innerHTML = '<span class="tag">'+esc(artifact.jobKind)+'</span>';
document.getElementById("summary").textContent = artifact.summary||"";

function spark(code){
  const r = results[code]; if(!r || !r.nav_tail) return "";
  const pts = Object.entries(r.nav_tail).map(([d,v])=>[d,v]);
  const pred = r.pred; if(pred) pts.push([pred.date, pred.nav]);
  if(pts.length<2) return "";
  const vals = pts.map(p=>p[1]), mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const W=320,H=52,P=4;
  const xy = pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1), H-P-(p[1]-mn)/rg*(H-2*P)]);
  const line = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last = xy[xy.length-1], hist = xy.slice(0,-1);
  const hline = hist.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${hline}" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    ${pred?`<path d="M${hist[hist.length-1][0]},${hist[hist.length-1][1]} L${last[0]},${last[1]}" fill="none" stroke="#e8a13a" stroke-width="1.5" stroke-dasharray="3 2"/>`:""}
    <circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${pred?'#e8a13a':'#58a6ff'}"/>
    <text x="${W-P}" y="10" text-anchor="end" fill="#5b6a7d" font-size="8" font-family="monospace">${pts[pts.length-1][0]}</text>
  </svg></div>`;
}

document.getElementById("grid").innerHTML = artifact.funds.map(f=>{
  const r = results[f.code];
  const err = f.error ? `<div class="errbox">⚠ ${esc(f.error)}</div>` : "";
  const badge = f.predLabel ? `<span class="badge ${f.predLabel==="锁定版"?"lock":"wait"}">${esc(f.predLabel)}</span>` : "";
  const intraday = f.intraday ? `<div class="intraday">
    <div class="row"><span>盘中参考（${f.intraday.date}）</span>
    <span class="v ${f.intraday.estRet>0?"up":f.intraday.estRet<0?"down":"dim"}">${f.intraday.estRet>0?"+":""}${f.intraday.estRet}% → ${CN(f.intraday.estNav)}</span></div>
    <div style="margin-top:4px">${f.intraday.detail.map(d=>`<span class="w">${esc(d.name)} <b class="${d.live>0?"up":d.live<0?"down":"dim"}">${d.live>0?"+":""}${d.live}%</b> ×${d.w}%</span>`).join("")}</div>
    <div style="color:var(--faint);margin-top:4px">${esc(f.intraday.note||"")}</div>
  </div>` : "";
  let detail = "";
  if(r){
    const step = (r.steps||[]).slice(-1)[0];
    let factorTbl = "";
    if(step && step.contrib){
      const order = Object.keys(step.contrib).sort((a,b)=>Math.abs(step.contrib[b])-Math.abs(step.contrib[a]));
      factorTbl = `<h4>因子贡献（${step.date}）</h4><table><tr><th>因子</th><th>因子收益</th><th>权重×收益</th></tr>` +
        order.map(k=>`<tr><td>${esc(k)}</td><td class="${step.factor_ret[k]>0?"up":step.factor_ret[k]<0?"down":""}">${step.factor_ret[k]>0?"+":""}${step.factor_ret[k]}%</td>
        <td class="${step.contrib[k]>0?"up":step.contrib[k]<0?"down":""}">${step.contrib[k]>0?"+":""}${step.contrib[k]}%</td></tr>`).join("") + "</table>";
    }
    const wrows = r.weights ? Object.entries(r.weights).filter(([,v])=>v>=1).sort((a,b)=>b[1]-a[1]) : [];
    const wsum = wrows.reduce((s,[,v])=>s+v,0);
    detail = `<div class="detail">
      <h4>当前权重（R²=${r.r2}）· 合计 ${wsum.toFixed(0)}%</h4>
      <div>${wrows.map(([k,v])=>`<div style="margin:3px 0"><span style="display:inline-block;width:110px;font-size:12px;color:var(--dim)">${esc(k)}</span>
        <span style="display:inline-block;height:8px;background:#58a6ff;border-radius:2px;width:${(v*3).toFixed(0)}px;vertical-align:middle"></span>
        <span style="font-family:var(--mono);font-size:11px;margin-left:6px">${v}%</span></div>`).join("")}</div>
      ${factorTbl}
      <h4>对齐检验（同日相关性应最大）</h4>
      <div style="font-family:var(--mono);font-size:11px;color:var(--faint)">${Object.entries(r.lag_check||{}).map(([k,v])=>esc(k)+": 前日"+v["-1"]+" / 当日<span style='color:var(--ok)'>"+v["0"]+"</span> / 次日"+v["1"]).join("　")||"—"}</div>
    </div>`;
  }
  return `<div class="card ${f.error?"err":""}" onclick="this.classList.toggle('open')">
    <div><span class="name">${esc(f.name)}</span><span class="code">${esc(f.code)}</span></div>
    <div class="row">
      <div class="nav"><span class="lbl">官方净值 ${f.officialDate||""}</span>${CN(f.officialNav)}</div>
      <div class="chg">${C(f.officialRet)}<div style="font-size:11px;color:var(--faint);font-weight:400">官方日收益</div></div>
    </div>
    ${f.error?"":`<div class="predbox">
      <div class="row"><span class="t">预测 ${f.predDate||""}${badge}</span><span class="v ${f.predRet>0?"up":f.predRet<0?"down":"dim"}">${f.predRet>0?"+":""}${f.predRet}%</span></div>
      <div class="row" style="margin-top:2px"><span class="band">${esc(f.band||"")}</span><span class="v" style="font-size:15px">${CN(f.predNav)}</span></div>
      ${f.predNote?`<div class="band">${esc(f.predNote)}</div>`:""}
    </div>`}
    ${spark(f.code)}
    ${f.weights&&f.weights.length?`<div class="weights">${f.weights.slice(0,6).map(w=>`<span class="w">${esc(w.name)} <b>${w.pct}%</b></span>`).join("")}</div>`:""}
    ${f.signals&&f.signals.length?`<div class="signals">${f.signals.map(s=>`<div class="sig ${s.level}"><i></i>${esc(s.label)}</div>`).join("")}</div>`:""}
    ${f.alert?`<div class="alert">⚠ ${esc(f.alert)}</div>`:""}
    ${intraday}${err}${detail}
  </div>`;
}).join("");

const tk = artifact.track||[];
document.getElementById("track").innerHTML = tk.length ? `<table>
  <tr><th>核对日</th><th>基金</th><th>净值日</th><th>预测</th><th>实际</th><th>偏差</th><th>预测净值</th></tr>
  ${tk.map(t=>`<tr><td>${t.checkDate}</td><td>${esc(t.code)}</td><td>${t.navDate}</td>
    <td>${t.predRet}%</td><td>${t.actualRet}%</td>
    <td class="${t.dev>0?"up":t.dev<0?"down":""}">${t.dev>0?"+":""}${t.dev}pct</td><td>${t.predNav}</td></tr>`).join("")}
</table>` : '<div class="empty">暂无核对记录</div>';

const co = artifact.corrections||[];
document.getElementById("corr").innerHTML = co.length ? `<table>
  <tr><th>日期</th><th>基金</th><th>净值日</th><th>偏差</th><th>动作</th><th>说明</th></tr>
  ${co.map(c=>`<tr><td>${c.date}</td><td>${esc(c.code)}</td><td>${c.navDate}</td>
    <td class="${c.dev>0?"up":"down"}">${c.dev>0?"+":""}${c.dev}pct</td><td>${esc(c.action)}</td>
    <td style="white-space:normal;min-width:300px;font-family:-apple-system,sans-serif;color:var(--dim)">${esc(c.note)}</td></tr>`).join("")}
</table>` : '<div class="empty">今日无修正记录</div>';

document.getElementById("footer").textContent =
  (artifact.notes||"") + "　·　生成时间 " + new Date().toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false}) + "（北京时间）· 点击卡片展开权重与因子贡献";
</script>
</body>
</html>
