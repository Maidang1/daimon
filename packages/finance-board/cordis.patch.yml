# Finance dashboard route on the dsh web server. The row injects the webServer
# and connection services (the latter gates the `/` takeover through the same
# authorizeIndex token/cookie flow the official SPA uses), so a composition
# without either carrier fails loud at startup.

- insert:
    - id: finance-board
      name: '@deepseek-ai/dsh-finance-board'
      inject: [webServer, connection]
      # config 全部走代码默认值：financeHome 相对本仓库推导（<repo>/dsh-home/finance，
      # 即 DSH_HOME 指向的目录），skillsPath / terminalDist 同样是相对本包的路径；
      # pythonBin 默认按 $PATH 找 python3。profile 级 patch 只在需要时覆盖——
      # 用哪个解释器是每台机器自己的事实，不属于仓库默认值。
