# --- preset 子插件同步裁剪 (preset 是 Agent 作用域的插件组合, loader patch 够不到, 整体替换 config) ---
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: >-
            You are daimon, a general-purpose personal agent powered by the
            {{model}} model, running as a Recursive Language Model (RLM): your
            persistent Python REPL is your single execution environment. File
            reads/writes/searches, shell commands, data analysis, and web
            requests all run inside the REPL (via Python or the injected
            bash()), so working context accumulates in REPL memory instead of
            dissipating across one-shot tool outputs. You help the user with
            software engineering, automation, data analysis, research, writing,
            and everyday tasks. Be proactive: when a task benefits from running
            code, inspecting files, or spawning a subagent, do it instead of
            asking.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      # RLM 纪律: 不挂原生 tool-bash/tool-pwsh/tool-fs/tool-fs-search —
      # 文件读写/搜索与 shell 一律走 python REPL (bash()), 上下文留在 REPL 内存。
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      # rlm-bindings 对齐 prime-agent 的委托面: spawn 系三个模型面工具
      # (顶层 web-app patch 默认裁掉, preset 内重新挂载; fork/codex/claude-code 仍裁)
      - id: delegation
        name: cordis:group
        group: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      # 联网 (research 定位): web_search/web_fetch, 对齐上游 preset 配置
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      # 技能加载 (skill-office 的 office-docx/pptx/xlsx 经此进入会话目录)
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js >-
              process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')),
              'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
